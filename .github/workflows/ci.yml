name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    container:
      image: gerbil/gerbil:v0.18.1
    steps:
      - uses: actions/checkout@v4
      - name: Run offline test suite
        run: |
          make -C source_code test
